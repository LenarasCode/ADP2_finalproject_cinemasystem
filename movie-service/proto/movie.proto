syntax = "proto3";
package movie;
option go_package = "github.com/cinema-system/movie-service/proto/movie";

service MovieService {
  rpc GetMovie(GetMovieRequest) returns (Movie);
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse);
  rpc SearchMovies(SearchMoviesRequest) returns (ListMoviesResponse);
}

message Movie {
  string id = 1;
  string title = 2;
  string genre = 3;
  int32 duration_min = 4;
  string poster_url = 5;
}
message GetMovieRequest { string id = 1; }
message ListMoviesRequest { int32 page = 1; int32 limit = 2; }
message ListMoviesResponse { repeated Movie movies = 1; int32 total = 2; }
message SearchMoviesRequest { string query = 1; }
