syntax = "proto3";
package showtime;
option go_package = "github.com/cinema-system/showtime-service/proto/showtime";

service ShowtimeService {
  rpc GetShowtime(GetShowtimeRequest) returns (Showtime);
  rpc ListShowtimesByMovie(ListShowtimesByMovieRequest) returns (ListShowtimesResponse);
  rpc GetSeatAvailability(GetSeatAvailabilityRequest) returns (SeatAvailabilityResponse);
  rpc CreateShowtime(CreateShowtimeRequest) returns (Showtime);
  rpc UpdateShowtime(UpdateShowtimeRequest) returns (Showtime);
  rpc DeleteShowtime(DeleteShowtimeRequest) returns (DeleteShowtimeResponse);
}

message Showtime {
  string id = 1;
  string movie_id = 2;
  string hall = 3;
  string start_time = 4;
  int32 available_seats = 5;
}

message GetShowtimeRequest { string id = 1; }
message ListShowtimesByMovieRequest { string movie_id = 1; }
message ListShowtimesResponse { repeated Showtime showtimes = 1; }

message Seat {
  string id = 1;
  string row = 2;
  int32 number = 3;
  bool is_available = 4;
}
message GetSeatAvailabilityRequest { string showtime_id = 1; }
message SeatAvailabilityResponse { repeated Seat seats = 1; }

message CreateShowtimeRequest {
  string movie_id = 1;
  string hall = 2;
  string start_time = 3;
  int32 available_seats = 4;
}

message UpdateShowtimeRequest {
  string id = 1;
  string movie_id = 2;
  string hall = 3;
  string start_time = 4;
  int32 available_seats = 5;
}

message DeleteShowtimeRequest { string id = 1; }
message DeleteShowtimeResponse { bool success = 1; }
