version: "3.8"
services:
  postgres-showtime:
    image: postgres:15
    environment:
      POSTGRES_DB: showtimedb
      POSTGRES_USER: showtime
      POSTGRES_PASSWORD: showtime
    ports:
      - "5433:5432"
    volumes:
      - pg_showtime_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  showtime-service:
    build: .
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: "postgres://showtime:showtime@postgres-showtime:5432/showtimedb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      GRPC_PORT: "50052"
    depends_on:
      - postgres-showtime
      - redis

volumes:
  pg_showtime_data:
