
services:
  postgres-movie:
    image: postgres:15
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
    ports:
      - "5434:5432"
    volumes:
      - pg_movie_data:/var/lib/postgresql/data

  postgres-showtime:
    image: postgres:15
    environment:
      POSTGRES_DB: showtimedb
      POSTGRES_USER: showtime
      POSTGRES_PASSWORD: showtime
    ports:
      - "5433:5432"
    volumes:
      - pg_showtime_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:15
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5435:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.9
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pg_movie_data:
  pg_showtime_data:
  pg_notification_data:
